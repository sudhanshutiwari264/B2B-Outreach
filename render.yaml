services:
  - type: web
    name: outreach-intelligence-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      # Render provisions this as a plain "postgresql://..." string with no driver info.
      # The app normalizes it itself (app/config.py), deriving both the asyncpg (async
      # runtime) and psycopg (sync, used by Alembic) variants automatically - no manual
      # edit needed. DATABASE_URL_SYNC is intentionally left unset so that derivation
      # kicks in.
      - key: DATABASE_URL
        fromDatabase:
          name: outreach-intelligence-db
          property: connectionString
      - key: TAVILY_API_KEY
        sync: false
      - key: TARQA_API_KEY
        sync: false
      - key: TARQA_BASE_URL
        sync: false
      - key: TARQA_MODEL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production

databases:
  - name: outreach-intelligence-db
    plan: starter
